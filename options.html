<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>PromptPolish Settings</title>
  <style>
    body { font: 14px/1.5 system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; }
    label { display: block; font-weight: 600; margin-top: 18px; }
    small { display: block; color: #666; margin-bottom: 6px; font-weight: 400; }
    input, textarea { width: 100%; box-sizing: border-box; padding: 8px; font: inherit; border: 1px solid #ccc; border-radius: 6px; }
    textarea { min-height: 110px; }
    button { margin-top: 20px; padding: 9px 18px; border: none; border-radius: 6px; background: #1f1e1d; color: #fff; font-weight: 600; cursor: pointer; }
    #status { margin-left: 10px; color: #2a7a2a; }
  </style>
</head>
<body>
  <h1>PromptPolish</h1>

  <label for="apiKey">Anthropic API key
    <small>Get one at console.anthropic.com. Stored only in this browser.</small>
  </label>
  <input id="apiKey" type="password" placeholder="sk-ant-..." />

  <label for="profile">About you (optional)
    <small>Added to prompts when relevant. Example: "I run a short-term rental business in Arizona."</small>
  </label>
  <textarea id="profile"></textarea>

  <label for="model">Model
    <small>Leave as is unless you know you want a different one.</small>
  </label>
  <input id="model" placeholder="claude-haiku-5-5" />

  <button id="save">Save</button><span id="status"></span>

  <script src="options.js"></script>
</body>
</html>
